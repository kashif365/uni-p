<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE" th:text="${site.site_name}">Campus Deals</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <style th:inline="css">:root { --brand: [[${site.primary_color}]]; }</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark brand-bg">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" th:text="${site.site_name}">Campus Deals</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/coupons}">Coupons</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/stores}">Stores</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Categories</a>
                    <ul class="dropdown-menu">
                        <li th:each="c : ${navCategories}"><a class="dropdown-item" th:href="@{/categories/{s}(s=${c.slug})}" th:text="${c.name}"></a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/categories}">All categories</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link" th:href="@{/blog}">Blog</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
            </ul>
            <form class="d-flex" role="search" th:action="@{/search}" method="get">
                <input class="form-control me-2" type="search" name="q" placeholder="Search stores or coupons"
                       th:value="${q}" aria-label="Search">
                <button class="btn btn-light" type="submit">Search</button>
            </form>
        </div>
    </div>
</nav>

<main class="py-4">
    <div class="container">
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <th:block layout:fragment="content"></th:block>
    </div>
</main>

<footer class="border-top py-4 mt-5 bg-light">
    <div class="container d-flex flex-wrap justify-content-between gap-2 small text-muted">
        <span><strong th:text="${site.site_name}">Campus Deals</strong> &middot; <span th:text="${site.site_tagline}"></span></span>
        <span>Offers and coupon codes are for demonstration.</span>
        <span>
            <a th:href="@{/about}">About</a> &middot;
            <a th:href="@{/privacy-policy}">Privacy</a> &middot;
            <a th:href="@{/admin}">Admin</a>
        </span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/site.js}"></script>
</body>
</html>
