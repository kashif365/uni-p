<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title>Users</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Users</h1>
        <a class="btn brand-btn" th:href="@{/admin/users/new}">Add user</a>
    </div>
    <table class="table table-hover bg-white align-middle">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td><a th:href="@{/admin/users/{id}/edit(id=${u.id})}" th:text="${u.name}"></a></td>
            <td th:text="${u.email}"></td>
            <td><span class="badge" th:classappend="${u.admin} ? 'text-bg-primary' : 'text-bg-secondary'" th:text="${u.role}"></span></td>
            <td class="text-end"><form th:replace="~{admin/fields :: delete(@{/admin/users/{id}/delete(id=${u.id})})}"></form></td>
        </tr>
        </tbody>
    </table>
    <p class="small text-muted">Admins can manage everything. Editors can manage stores, coupons, categories and the blog.</p>
</div>
</body>
</html>
