<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Form controls bound to the surrounding th:object; "name" is the form property. -->

<div th:fragment="textField(name, label, type)" class="mb-3">
    <label class="form-label" th:for="${name}" th:text="${label}"></label>
    <input class="form-control" th:type="${type}" th:field="*{__${name}__}" th:errorclass="is-invalid">
    <div class="invalid-feedback" th:errors="*{__${name}__}"></div>
</div>

<div th:fragment="textArea(name, label, rows)" class="mb-3">
    <label class="form-label" th:for="${name}" th:text="${label}"></label>
    <textarea class="form-control" th:rows="${rows}" th:field="*{__${name}__}" th:errorclass="is-invalid"></textarea>
    <div class="invalid-feedback" th:errors="*{__${name}__}"></div>
</div>

<div th:fragment="checkField(name, label)" class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox" value="true" th:field="*{__${name}__}">
    <label class="form-check-label" th:for="${#ids.prev(name)}" th:text="${label}"></label>
</div>

<!-- Global (non-field) errors, e.g. a rejected upload -->
<div th:fragment="globalErrors" class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
    <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
</div>

<!-- Delete button with a confirmation prompt -->
<form th:fragment="delete(action)" th:action="${action}" method="post" class="d-inline"
      onsubmit="return confirm('Delete this item? This cannot be undone.');">
    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
</form>
</body>
</html>
