<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE - Admin">Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <style th:inline="css">:root { --brand: [[${site.primary_color}]]; } .sidebar a.active { font-weight: 600; color: var(--brand); }</style>
</head>
<body class="bg-light">
<nav class="navbar navbar-dark brand-bg px-3">
    <a class="navbar-brand py-0 d-flex align-items-center gap-2" th:href="@{/admin}">
        <img th:src="@{/img/logo-white.svg}" th:alt="${site.site_name}" height="32"><span class="badge text-bg-light">Admin</span>
    </a>
    <div class="d-flex align-items-center gap-3 text-white small">
        <a class="text-white" th:href="@{/}" target="_blank">View site</a>
        <span th:text="${userEmail}"></span>
        <form th:action="@{/logout}" method="post"><button class="btn btn-sm btn-light">Sign out</button></form>
    </div>
</nav>
<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 bg-white border-end min-vh-100 py-3 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/admin}" th:classappend="${adminSection == 'dashboard'} ? 'active'">Dashboard</a>
                <a class="nav-link" th:href="@{/admin/stores}" th:classappend="${adminSection == 'stores'} ? 'active'">Stores</a>
                <a class="nav-link" th:href="@{/admin/coupons}" th:classappend="${adminSection == 'coupons'} ? 'active'">Coupons</a>
                <a class="nav-link" th:href="@{/admin/categories}" th:classappend="${adminSection == 'categories'} ? 'active'">Categories</a>
                <a class="nav-link" th:href="@{/admin/blog}" th:classappend="${adminSection == 'blog'} ? 'active'">Blog posts</a>
                <a class="nav-link" th:href="@{/admin/blog/categories}" th:classappend="${adminSection == 'blog-categories'} ? 'active'">Blog categories</a>
                <th:block th:if="${isAdmin}">
                    <hr>
                    <a class="nav-link" th:href="@{/admin/users}" th:classappend="${adminSection == 'users'} ? 'active'">Users</a>
                    <a class="nav-link" th:href="@{/admin/settings}" th:classappend="${adminSection == 'settings'} ? 'active'">Settings</a>
                </th:block>
            </nav>
        </aside>
        <main class="col-md-10 p-4">
            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <th:block layout:fragment="content"></th:block>
        </main>
    </div>
</div>
</body>
</html>
