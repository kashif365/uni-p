<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title th:text="${post.id == null} ? 'Write a post' : 'Edit post'">Post</title></head>
<body>
<div layout:fragment="content" style="max-width: 900px">
    <h1 class="h3 mb-3" th:text="${post.id == null} ? 'Write a post' : 'Edit post'"></h1>
    <form th:action="${post.id == null} ? @{/admin/blog} : @{/admin/blog/{id}(id=${post.id})}" th:object="${form}"
          method="post" enctype="multipart/form-data" class="card card-body">
        <div th:replace="~{admin/fields :: globalErrors}"></div>
        <div th:replace="~{admin/fields :: textField('title', 'Title', 'text')}"></div>
        <div class="row">
            <div class="col-md-6"><div th:replace="~{admin/fields :: textField('slug', 'URL slug (leave empty to generate)', 'text')}"></div></div>
            <div class="col-md-3">
                <div class="mb-3">
                    <label class="form-label" for="categoryId">Category</label>
                    <select class="form-select" th:field="*{categoryId}">
                        <option value="">None</option>
                        <option th:each="c : ${allCategories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                </div>
            </div>
            <div class="col-md-3"><div th:replace="~{admin/fields :: textField('author', 'Author', 'text')}"></div></div>
        </div>
        <div th:replace="~{admin/fields :: textArea('excerpt', 'Short summary', 2)}"></div>
        <div th:replace="~{admin/fields :: textArea('content', 'Content (HTML allowed)', 12)}"></div>
        <div class="mb-3">
            <label class="form-label" for="imageFile">Image</label>
            <div class="mb-2" th:if="${post.image}"><img th:src="@{${post.image}}" alt="" style="max-height: 120px"></div>
            <input class="form-control" type="file" id="imageFile" name="imageFile" accept="image/*">
        </div>
        <div class="mb-3"><div th:replace="~{admin/fields :: checkField('published', 'Published')}"></div></div>
        <div>
            <button class="btn brand-btn" type="submit">Save</button>
            <a class="btn btn-link" th:href="@{/admin/blog}">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
