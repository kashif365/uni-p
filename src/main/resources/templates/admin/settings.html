<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{admin/layout}">
<head><title>Settings</title></head>
<body>
<div layout:fragment="content" style="max-width: 640px">
    <h1 class="h3 mb-3">Site settings</h1>
    <form th:action="@{/admin/settings}" method="post" class="card card-body">
        <div class="mb-3" th:each="s : ${settings}">
            <label class="form-label" th:for="${s.key}" th:text="${s.label}"></label>
            <input class="form-control" th:id="${s.key}" th:name="${s.key}" th:value="${s.value}"
                   th:type="${s.key == 'primary_color'} ? 'color' : (${s.key == 'contact_email'} ? 'email' : 'text')">
        </div>
        <div><button class="btn brand-btn" type="submit">Save settings</button></div>
    </form>
</div>
</body>
</html>
