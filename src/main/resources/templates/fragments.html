<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- One coupon. Clicking "Show code" reveals and copies the code (see site.js). -->
<div th:fragment="coupon(c)" class="card coupon h-100">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start mb-1">
            <a class="small text-muted text-decoration-none" th:href="@{/stores/{s}(s=${c.store.slug})}" th:text="${c.store.name}"></a>
            <span>
                <span class="badge text-bg-success" th:if="${c.verified}">Verified</span>
                <span class="badge text-bg-warning" th:if="${c.exclusive}">Exclusive</span>
            </span>
        </div>
        <h3 class="h6 card-title" th:text="${c.title}"></h3>
        <p class="small text-muted mb-2" th:if="${c.description}" th:text="${c.description}"></p>
        <p class="small mb-2" th:if="${c.expiresOn}" th:classappend="${c.expired} ? 'text-danger'"
           th:text="${(c.expired ? 'Expired ' : 'Expires ') + #temporals.format(c.expiresOn, 'd MMM yyyy')}"></p>
        <div class="mt-auto">
            <button type="button" class="btn brand-btn w-100 reveal" th:if="${c.hasCode()}"
                    th:attr="data-code=${c.code},data-id=${c.id},data-url=${c.store.websiteUrl}">Show code</button>
            <a class="btn btn-outline-secondary w-100" th:unless="${c.hasCode()}" target="_blank" rel="noopener"
               th:href="${c.store.websiteUrl ?: '#'}">Get deal</a>
            <p class="small text-muted mt-2 mb-0" th:if="${c.usedCount > 0}" th:text="|Used ${c.usedCount} times|"></p>
        </div>
    </div>
</div>

<!-- Blog post summary card -->
<div th:fragment="postCard(p)" class="card h-100">
    <img th:if="${p.image}" th:src="@{${p.image}}" class="card-img-top" th:alt="${p.title}">
    <div class="card-body">
        <div class="small text-muted mb-1">
            <span th:text="${#temporals.format(p.createdAt, 'd MMM yyyy')}"></span>
            <span th:if="${p.category}" th:text="| &middot; ${p.category.name}|"></span>
        </div>
        <h3 class="h6"><a class="stretched-link text-decoration-none" th:href="@{/blog/{s}(s=${p.slug})}" th:text="${p.title}"></a></h3>
        <p class="small text-muted mb-0" th:text="${p.excerpt}"></p>
    </div>
</div>

<!-- Store logo or initials -->
<span th:fragment="logo(s)" class="store-logo">
    <img th:if="${s.logo}" th:src="@{${s.logo}}" th:alt="${s.name}">
    <span th:unless="${s.logo}" th:text="${#strings.substring(s.name, 0, 1)}"></span>
</span>

<!-- Previous / next links for a Spring Data Page -->
<nav th:fragment="pager(page, base)" th:if="${page.totalPages > 1}" class="mt-4">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${base}(page=${page.number - 1})}">Previous</a>
        </li>
        <li class="page-item disabled"><span class="page-link" th:text="|Page ${page.number + 1} of ${page.totalPages}|"></span></li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${base}(page=${page.number + 1})}">Next</a>
        </li>
    </ul>
</nav>

</body>
</html>
