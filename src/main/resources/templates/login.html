<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Admin sign in</title></head>
<body>
<div layout:fragment="content" class="mx-auto" style="max-width: 380px">
    <div class="text-center mb-3"><img th:src="@{/img/logo.svg}" th:alt="${site.site_name}" height="48"></div>
    <h1 class="h4 mb-3">Admin sign in</h1>
    <div class="alert alert-danger" th:if="${param.error}">These credentials do not match our records.</div>
    <div class="alert alert-info" th:if="${param.logout}">You have been signed out.</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button class="btn brand-btn w-100" type="submit">Sign in</button>
    </form>
</div>
</body>
</html>
