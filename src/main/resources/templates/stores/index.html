<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>All stores</title></head>
<body>
<div layout:fragment="content">
    <h1 class="h3 mb-3">All stores</h1>
    <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
        <div class="col" th:each="s : ${stores}">
            <a class="card store-card h-100 text-center p-3" th:href="@{/stores/{slug}(slug=${s.slug})}">
                <div><span th:replace="~{fragments :: logo(${s})}"></span></div>
                <div class="fw-semibold mt-2" th:text="${s.name}"></div>
                <div class="small text-muted" th:text="|${#lists.size(s.activeCoupons)} coupons|"></div>
            </a>
        </div>
    </div>
</div>
</body>
</html>
