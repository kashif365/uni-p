<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title th:text="|${category.name} deals|">Category</title></head>
<body>
<div layout:fragment="content">
    <h1 class="h3" th:text="|${category.name} deals|"></h1>
    <p class="text-muted" th:if="${category.description}" th:text="${category.description}"></p>

    <h2 class="section-title h5">Stores</h2>
    <p th:if="${#lists.isEmpty(stores)}" class="text-muted">No stores in this category yet.</p>
    <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-light border" th:each="s : ${stores}" th:href="@{/stores/{slug}(slug=${s.slug})}" th:text="${s.name}"></a>
    </div>

    <h2 class="section-title h5">Coupons</h2>
    <p th:if="${#lists.isEmpty(coupons)}" class="text-muted">No coupons in this category yet.</p>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-3">
        <div class="col" th:each="c : ${coupons}">
            <div th:replace="~{fragments :: coupon(${c})}"></div>
        </div>
    </div>
</div>
</body>
</html>
