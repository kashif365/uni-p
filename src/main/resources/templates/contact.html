<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head><title>Contact us</title></head>
<body>
<div layout:fragment="content">
    <div class="mx-auto" style="max-width: 640px">
        <h1 class="h3">Contact us</h1>
        <p class="text-muted">Questions or suggestions? Send us a message or email
            <a th:href="|mailto:${site.contact_email}|" th:text="${site.contact_email}"></a>.</p>

        <form th:action="@{/contact}" th:object="${contact}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="name">Name</label>
                    <input class="form-control" th:field="*{name}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" th:field="*{email}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="subject">Subject</label>
                    <input class="form-control" th:field="*{subject}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{subject}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="message">Message</label>
                    <textarea class="form-control" rows="5" th:field="*{message}" th:errorclass="is-invalid"></textarea>
                    <div class="invalid-feedback" th:errors="*{message}"></div>
                </div>
            </div>
            <button class="btn brand-btn mt-3" type="submit">Send message</button>
        </form>
    </div>
</div>
</body>
</html>
