spring.application.name=coupon-deals
server.port=${PORT:8080}

# Folder for uploaded images (store logos, blog images); served at /uploads/**
app.upload-dir=${UPLOAD_DIR:uploads}

# SQLite database file (created automatically on first start)
spring.datasource.url=jdbc:sqlite:${DB_PATH:database/coupon-deals.sqlite}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.busy_timeout=10000

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true

spring.flyway.locations=classpath:db/migration

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB
